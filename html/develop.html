
<!-- Nominee Information -->
<div class="section-card">
  <div class="section-title">2. Nominee Information</div>
  <div class="flex-row">
    <div class="flex-col-full" style="margin-bottom: 12px;">
      <label for="nomination_type">Nomination Type <span class="required">*</span></label>
      <select id="nomination_type" name="nomination_type" required aria-required="true">
        <option value="self">Self-Nomination</option>
        <option value="peer">Nominating a Colleague</option>
      </select>
    </div>
  </div>
  <div class="flex-row">
    <div class="flex-col">
      <label for="nominee_name">Nominee Full Name <span class="required">*</span></label>
      <input type="text" id="nominee_name" name="nominee_name" required aria-required="true">
    </div>Google Project Management
    <div class="flex-col">
      <label for="nominee_email">Nominee Campus Email Address <span class="required">*</span></label>
      <input type="email" id="nominee_email" name="nominee_email" placeholder="username@cltcc.edu" required aria-required="true">
    </div>
  </div>
  <div class="flex-row" style="margin-top: 12px;">
    <div class="flex-col">
      <label for="nominee_department">Nominee Department / Program <span class="required">*</span></label>
      <input type="text" id="nominee_department" name="nominee_department" required aria-required="true">
    </div>
    <div class="flex-col">
      <label for="nominee_title">Nominee Academic Rank / Title <span class="required">*</span></label>
      <input type="text" id="nominee_title" name="nominee_title" placeholder="e.g., Instructor, Associate Professor" required aria-required="true">
    </div>
  </div>
</div>

<!-- Statement & Qualifications -->
<div class="section-card">
  <div class="section-title">3. Nomination Statement</div>
  <div class="flex-row">
    <div class="flex-col-full">
      <label for="statement">Statement of Support / Qualifications <span class="required">*</span></label>
      <textarea id="statement" name="statement" required aria-required="true" placeholder="Please briefly describe how the nominee embodies leadership, service, integrity, and shared governance..."></textarea>
      <div class="help-text">Limit response to 250-300 words. This statement may be shared with faculty voters during the election period.</div>
    </div>
  </div>
</div>

<!-- Eligibility & Verification -->
<div class="section-card">
  <div class="section-title">4. Eligibility Verification</div>
  <div class="checkbox-group">
    <input type="checkbox" id="eligibility_confirm" name="eligibility_confirm" required aria-required="true">
    <label for="eligibility_confirm">I confirm that the nominee is a full-time faculty member in good standing and meets all eligibility criteria set forth by the Faculty Senate Constitution. <span class="required">*</span></label>
  </div>
  <div class="checkbox-group" style="margin-top: 12px;">
    <input type="checkbox" id="consent_confirm" name="consent_confirm" required aria-required="true">
    <label for="consent_confirm">If nominating a colleague, I have discussed this nomination with the nominee, and they have agreed to serve if elected. <span class="required">*</span></label>
  </div>
</div>

<div style="margin-top: 24px;">
  <button type="submit" class="btn-submit">Submit Nomination</button>
</div>
